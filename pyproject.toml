[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fake-user-turn-guardrail"
version = "0.2.0"
description = "A deterministic two-layer guardrail for fabricated user turns and false user-attribution in LLM transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kurolayic"}]
keywords = ["llm", "guardrail", "hallucination", "claude-code", "transcript"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
fake-user-turn-hook = "fake_user_turn_guardrail.hook:main"
fake-user-turn-filter = "fake_user_turn_guardrail.filter_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
